<body style="   margin: 0;
                padding: 0;">

    <!--Barra de navegação-->
    <header>
        <nav style="    background-color: #AF2767;
        height: 5vh;
        color: #fff;
        padding: 1vh;">



            <div style="    display: grid;
            grid-template-columns: auto auto auto auto;
            align-items: center;
            transform: translateY(-15px);" >

                <!--Links de navegação-->
                <a style="    text-decoration: none;
                color: #ffff;
                margin-left: 50px;" href="index.html">
                    <h1>VERSATILLE</h1> <!--Logo da nav-->
                </a>

                <a style="    text-decoration: none;
                color: #ffff;
                margin-left: 50px;" href="sobre_versatille.html">Sobre o Versatille</a>

                <a style="    text-decoration: none;
                color: #ffff;
                margin-left: 50px;" href="guarda-roupa.html">Guarda-Roupa</a>


                <!--Botão de entrar-->
                <a style="       border-radius: 10px;
                background-color: #FFD8D3;
                max-width: 15vh;
                padding: 0.5vh;
                text-align: center;
                color: black; text-decoration: none;" href="login.html" id="entrar">Entrar</a>



            </div>

        </nav>
    </header>

    <main style="   display: grid;
    grid-template-rows: auto auto auto;
    text-align: center;
    margin-top: 200px;">

 
        <!-- Form Element -->
        <form >

            <!-- Nome Input Group -->


            <div >
                <span style="font-family: 'Instrument Serif', serif;" >Por favor, preencha o seu nome.</span>

                <div style="margin-bottom: 1vh;">
                    
                    <input type="text" id="nomeInput" placeholder="Nome" autocomplete="username" required style="   border-radius: 10px;
    padding: 1vh;
    width: 50%;

    background-color: #af2767;
    color: #fff;">
                </div>
            </div>



            <!-- Senha Input Group -->

            <div >
                <span style="font-family: 'Instrument Serif', serif;">Por favor, insira sua senha.</span>
                <div style="margin-bottom: 5vh;">


            
                    <input type="password" id="senhaInput" placeholder="Senha" autocomplete="current-password" required style="   border-radius: 10px;
    padding: 1vh;
    width: 50%;

    background-color: #af2767;
    color: #fff;">
                </div>
            </div>


            <!-- Submit Button -->
            <input type="submit" value="Entrar" style="   border-radius: 10px;
    padding: 1vh;
    width: 50%;

    background-color: #af2767;
    color: #fff;">

            </input>

            

        </form>
        <a style="      padding-top: 5vh;

        text-decoration: none;" href="cadastro_dados.html">Não tem conta? Cadastre-se agora! </a>
